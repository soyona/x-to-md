<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>X Content Utility</title>
    <style>
      :root {
        color-scheme: light;
        --x-color-background: rgb(255, 255, 255);
        --x-color-primary: rgb(15, 20, 25);
        --x-color-secondary: rgb(83, 100, 113);
        --x-color-border: rgb(239, 243, 244);
        --x-color-hover: rgba(15, 20, 25, .08);
        --x-color-focus: rgb(29, 155, 240);
        --x-color-error: rgb(244, 33, 46);
        --x-color-success: rgb(0, 186, 124);
        --x-radius-panel: 16px;
        --x-radius-pill: 9999px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html { overflow: hidden; border-radius: var(--x-radius-panel); background: transparent; }
      body { width: 300px; margin: 0; background: transparent; color: var(--x-color-primary); }
      .popup-card { box-sizing: border-box; width: 300px; padding: 20px; border: 1px solid var(--x-color-border); border-radius: var(--x-radius-panel); background: var(--x-color-background); overflow: hidden; }
      h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.25; letter-spacing: -.015em; }
      .description { margin: 0; color: var(--x-color-secondary); font-size: 15px; line-height: 1.45; }
      button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 46px; margin-top: 20px; border: 0; border-radius: var(--x-radius-pill); background: var(--x-color-primary); color: var(--x-color-background); font: inherit; font-size: 15px; font-weight: 700; text-align: center; white-space: nowrap; cursor: pointer; transition: background-color .15s ease, opacity .15s ease; }
      button:hover { background: rgb(39, 44, 48); }
      button:disabled { opacity: .55; cursor: wait; }
      button:focus-visible { outline: 2px solid var(--x-color-focus); outline-offset: 2px; }
      #status { min-height: 0; margin: 10px 0 0; font-size: 12px; line-height: 1.45; }
      #status:empty { display: none; }
      .error { color: var(--x-color-error); }
      .success { color: var(--x-color-success); }
    </style>
  </head>
  <body>
    <main class="popup-card" aria-label="Copy Markdown">
      <h1>Copy Markdown</h1>
      <p class="description">Copy the current X content as Markdown. Nothing is uploaded.</p>
      <button id="import" type="button">Extract and copy</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="markdown.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
