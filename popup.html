<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>X 原文工具</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { width: 260px; margin: 0; padding: 16px; color: #15181d; }
      h1 { margin: 0 0 8px; font-size: 16px; }
      p { margin: 0 0 14px; color: #565d67; font-size: 12px; line-height: 1.5; }
      button { width: 100%; min-height: 36px; border: 0; border-radius: 8px; background: #15181d; color: white; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 18px; margin-top: 10px; font-size: 12px; line-height: 1.5; }
      .error { color: #b3261e; }
      .success { color: #147a45; }
    </style>
  </head>
  <body>
    <h1>X 原文工具</h1>
    <p>读取当前 X 推文或 Article，打开原文预览，并复制不含图片的 Markdown。</p>
    <button id="import" type="button">读取、预览并复制 Markdown</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="markdown.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
