<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Inbox</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main id="app" class="inbox" aria-label="X Content Inbox">
      <nav class="tabbar" aria-label="Content Inbox navigation">
        <div class="brand-mark" aria-label="X Content Inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817-5.963 6.817H1.684l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 3.84H5.117l11.966 15.93Z"/></svg></div>
        <button type="button" data-view="candidates" class="tab is-active" aria-label="收件箱" title="收件箱">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
          <span class="sr-only">收件箱</span>
        </button>
        <button type="button" data-view="subscriptions" class="tab" aria-label="关注作者" title="关注作者">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.7-3 2.6-4.5 5.5-4.5s4.8 1.5 5.5 4.5M16 5.5a3 3 0 0 1 0 5.8M16 14.5c2.5.2 4.1 1.7 4.5 4.5"/></svg>
          <span class="sr-only">关注作者</span>
        </button>
        <button type="button" data-view="assets" class="tab" aria-label="素材库" title="素材库">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v16l-6-3.8-6 3.8z"/></svg>
          <span class="sr-only">素材库</span>
        </button>
        <div class="tab tab-more" role="img" aria-label="更多内容" title="更多内容">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          <span class="sr-only">更多内容</span>
        </div>
      </nav>
      <div class="main-column">
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <header class="page-header"><button class="back-button" type="button" aria-label="返回" title="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h1 id="page-title">收件箱</h1></header>
        <section id="current-context" class="current-context" aria-live="polite"></section>
        <section id="view" class="view"></section>
      </div>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
