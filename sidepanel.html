<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>待读 · X to MD</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main id="app" class="inbox" aria-label="X to MD Article 工作区">
      <nav class="tabbar" aria-label="Article 工作区导航">
        <button type="button" data-view="readingList" class="tab is-active" aria-label="待读" title="待读">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h17l-2 12.5H5.5L3.5 5.5zm2.7 2 1.1 7h9.4l1.1-7H6.2zM8 3h8v2H8z"/><path d="M9 11h6v2H9z"/></svg>
          <span class="sr-only">待读</span>
        </button>
        <button type="button" data-view="assets" class="tab" aria-label="素材库" title="素材库">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.75h12v16.5l-6-3.75-6 3.75z"/></svg>
          <span class="sr-only">素材库</span>
        </button>
        <button type="button" data-view="authors" class="tab" aria-label="作者" title="作者">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4c-1.105 0-2 .9-2 2s.895 2 2 2 2-.9 2-2-.895-2-2-2zM6 6c0-2.21 1.791-4 4-4s4 1.79 4 4-1.791 4-4 4-4-1.79-4-4zm-2.349 13h12.698c-.337-1.8-1.023-3.21-1.945-4.19C13.318 13.65 11.838 13 10 13s-3.317.65-4.404 1.81c-.922.98-1.608 2.39-1.945 4.19zm.486-5.56C5.627 11.85 7.648 11 10 11s4.373.85 5.863 2.44c1.477 1.58 2.366 3.8 2.632 6.46l.11 1.1H1.395l.11-1.1c.266-2.66 1.155-4.88 2.632-6.46zM20 8h3v2h-3v3h-2v-3h-3V8h3V5h2z"/></svg>
          <span class="sr-only">作者</span>
        </button>
      </nav>
      <div class="main-column">
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <section id="view" class="view"></section>
      </div>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
