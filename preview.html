<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X Article Preview</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <main class="preview-page" aria-label="X Article Preview">
      <header class="preview-header">
        <div class="preview-heading">
          <strong>Extracted · Markdown copied</strong>
          <span>Native article preview</span>
        </div>
        <div class="preview-actions">
          <button id="copy" type="button" disabled>Copy Markdown</button>
          <button id="close" type="button" class="secondary">Close</button>
        </div>
      </header>
      <article id="article" class="preview-reader">
        <p class="empty">Loading article…</p>
      </article>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="markdown.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
