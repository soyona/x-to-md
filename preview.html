<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X 原文预览</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <main class="preview-page" aria-label="X 原文预览">
      <header class="preview-header">
        <div class="preview-heading">
          <strong>已提取 · Markdown 已复制</strong>
          <span>原文阅读预览</span>
        </div>
        <div class="preview-actions">
          <button id="copy" type="button" disabled>复制 Markdown</button>
          <button id="close" type="button" class="secondary">关闭</button>
        </div>
      </header>
      <article id="article" class="preview-reader">
        <p class="empty">正在加载原文…</p>
      </article>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="markdown.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
