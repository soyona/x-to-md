<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown 预览</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <main class="preview-page" aria-label="Markdown 预览">
      <header class="preview-header">
        <div class="preview-heading">
          <strong id="preview-title">Markdown 预览</strong>
          <span id="preview-subtitle">只在此设备临时展示</span>
        </div>
        <div class="preview-actions">
          <button id="save" class="preview-save-button" type="button" hidden>保存为素材</button>
          <button id="copy" class="preview-icon-button" type="button" disabled aria-label="复制 Markdown" title="复制 Markdown">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7.5V5.75A1.75 1.75 0 0 1 9.75 4h8.5A1.75 1.75 0 0 1 20 5.75v8.5A1.75 1.75 0 0 1 18.25 16H16.5"/><rect x="4" y="8" width="12" height="12" rx="1.75"/></svg>
          </button>
          <button id="close" class="preview-icon-button secondary" type="button" aria-label="关闭预览" title="关闭预览">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>
      <article id="article" class="preview-reader">
        <p class="empty">Loading article…</p>
      </article>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="markdown.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
